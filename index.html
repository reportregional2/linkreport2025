<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redirecting...</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ffffff,#d9ecff,#6fb8ff);
}

/* Bubble Background */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(30px);
    animation:float 10s infinite ease-in-out;
}

body::before{
    width:300px;
    height:300px;
    background:#69b7ff;
    top:-80px;
    left:-80px;
}

body::after{
    width:350px;
    height:350px;
    background:#ffffff;
    bottom:-100px;
    right:-100px;
    animation-delay:2s;
}

@keyframes float{
    50%{
        transform:translateY(40px) scale(1.1);
    }
}

.card{
    width:360px;
    padding:40px 30px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.35);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 40px rgba(0,0,0,.15);
    z-index:10;
}

.icon{
    font-size:70px;
    animation:rotate 2s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

h2{
    margin-top:20px;
    color:#0d47a1;
}

p{
    color:#444;
    margin:15px 0;
}

.progress{
    width:100%;
    height:10px;
    background:#d6e9ff;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#2196F3,#64B5F6);
    animation:loading 3s linear forwards;
}

@keyframes loading{
    from{width:0%;}
    to{width:100%;}
}

.count{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
    color:#1565C0;
}
</style>
</head>

<body>

<div class="card">

<div class="icon">🌐</div>

<h2>Mohon Tunggu</h2>

<p>Anda akan diarahkan ke halaman tujuan dalam</p>

<div class="count" id="count">3</div>

<div class="progress">
<div class="bar"></div>
</div>

</div>

<script>
let detik = 3;

const hitung = setInterval(()=>{
    detik--;
    document.getElementById("count").innerHTML = detik;

    if(detik<=0){
        clearInterval(hitung);
        window.location.href="https://link-report.dashboard-area2.workers.dev/";
    }
},1000);
</script>

</body>
</html>
